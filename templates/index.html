<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0px 10px 25px rgba(0, 0, 0, 0.2);
            width: 450px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #444;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 5px;
            border: 2px solid #ddd;
            resize: none;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #4facfe;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00f2fe;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f5f5f5;
            border-left: 5px solid #4facfe;
            border-right: 8px solid #4facfe;
        }

        .result h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .result p {
            font-size: 18px;
            color: #222;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Language Translation Tool</h1>
        <form method="POST">

            <label for="text">Enter text to translate:</label>

            <textarea id="text" name="text" placeholder="Type your text here..."
                required>{{ request.form.get('text','') }}</textarea>

            <button type="submit">Translate</button>

        </form>

        {% if result %}

        <div class="result">
            <h3>Translated Text:</h3>
            <p>{{ result }}</p>
        </div>

        {% endif %}
    </div>

</body>

</html>
